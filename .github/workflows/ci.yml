name: BrowserGym prototype static tests
on: [push, pull_request]
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile smoke
        run: python -m py_compile scripts/browsergym/smoke.py
      - name: Verify contract
        run: python -m unittest discover -s tests -v
