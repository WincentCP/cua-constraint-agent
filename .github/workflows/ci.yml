name: WebArena transition invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Format working tree for validation
        run: npm run format
      - name: Show formatting patch
        run: git diff -- src scripts tests config package.json tsconfig.json README.md docs .github/workflows/ci.yml
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run webarena:validate
