name: CUA Contracts and Small Extension
on: [push, pull_request]
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile agent and test sources
        run: python -m compileall -q scripts/browsergym tests
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Check four-checkpoint extension schedule
        run: python scripts/browsergym/small_extension.py --dry-run
      - name: Parse active Pilot, Main and Small Extension PowerShell wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('.\scripts\browsergym\run_pilot.ps1', '.\scripts\browsergym\run_main.ps1', '.\scripts\browsergym\run_small_extension.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ("$script parse error: " + (($parseErrors | ForEach-Object { $_.Message }) -join '; '))
            }
          }
