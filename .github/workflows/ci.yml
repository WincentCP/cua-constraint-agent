name: BrowserGym prototype static tests
on: [push, pull_request]
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile smoke
        run: python -m compileall -q scripts/browsergym tests
      - name: Verify contract
        run: python -m unittest discover -s tests -v
      - name: Parse pilot PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\browsergym\run_pilot.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw (($parseErrors | ForEach-Object { $_.Message }) -join '; ')
          }
