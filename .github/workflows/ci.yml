name: WebArena transition invariants
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format
      - name: Commit formatter corrections to staging
        run: |
          git config user.name "artifact-ci"
          git config user.email "artifact-ci@users.noreply.github.com"
          git add src scripts tests config README.md docs package.json .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to feasibility implementation"
            git push origin HEAD:shopping-only-feasibility-v2
          fi
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run webarena:validate
      - run: npm run artifacts:init -- --stage poc
      - run: npm run artifacts:init -- --stage pilot
      - run: npm run artifacts:report -- --stage pilot
