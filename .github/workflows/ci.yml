name: Research invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate benchmark model manifest
        run: >-
          node -e "const m=require('./scripts/benchmark/models.json');
          if(m.length<3||m.length>4) throw new Error('expected 3-4 committed benchmark candidates');
          const bad=m.filter(x=>!x.name.toLowerCase().endsWith('q4_k_m'));
          if(bad.length) throw new Error('non-Q4_K_M candidates: '+bad.map(x=>x.name).join(', '));"
      - name: Parse benchmark PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/benchmark/run.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run experiment -- validate
